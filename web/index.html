			canvas.addEventListener('touchmove', preventGesture, { passive: false });



		}

	})();



	/* Progress bridge (called by boot.js) */

	var _bootPct = 0;

	function setBootProgress(val, msg) {

		if (val !== undefined && isFinite(val)) {

			_bootPct = Math.min(1, Math.max(0, val));

			var fill = document.getElementById('bootBarFill');

			var pct  = document.getElementById('bootBarPct');

			if (fill) fill.style.width = (_bootPct * 100).toFixed(1) + '%';

			if (pct)  pct.textContent = Math.round(_bootPct * 100) + '%';

		}

		var stat = document.getElementById('bootStatus');

		if (msg && stat) stat.textContent = msg;

	}

	window.__setBootProgress = setBootProgress;



	

	</script>
